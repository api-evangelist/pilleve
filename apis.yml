name: Pilleve
description: >-
  Pilleve is a medication-compliance and controlled-substance monitoring
  company in the digital health space. Its Amethyst System pairs a smart
  pill-dispensing device that releases one pill at a time and detects
  tampering with a patient mobile app and a clinician portal for real-time
  monitoring, adherence tracking, diversion prevention, compliance
  documentation, and medication disposal. Pilleve serves hospital systems,
  pain clinics, and pharmacies, and was surfaced as a 500 Global portfolio
  company and added to the API Evangelist network as a lead. As of this
  enrichment pass Pilleve publishes a marketing website and a clinician
  login but exposes no public API, developer portal, or documentation.
